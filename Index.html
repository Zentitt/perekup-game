<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ПЕРЕКУП ULTRA 2.0</title>
    <style>
        /* ========== БАЗА И СТИЛЬ (КАК В СТАРОЙ ВЕРСИИ) ========== */
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; user-select: none; }
        body { background: radial-gradient(circle at 20% 10%, #1a2635, #070b10 80%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 10px; color: #fff; }
        
        .game { max-width: 580px; width: 100%; background: linear-gradient(145deg, #1e2532, #12171f); border-radius: 42px; padding: 18px 16px 20px; box-shadow: 0 45px 70px -25px #000000dd, 0 0 0 1px #4a586c, inset 0 2px 10px #ffffff10; border: 1px solid #55637a; }
        
        /* Шапка с деньгами и уровнями */
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .logo { font-weight: 900; font-size: 20px; background: linear-gradient(135deg, #8ad4ff, #3d9eff, #a06bff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .stats { display: flex; gap: 10px; align-items: center; font-size: 13px; font-weight: bold; }
        .stat-badge { background: #0a121e; padding: 6px 10px; border-radius: 20px; border: 1px solid #3d7a3d; color: #b0f0b0; }
        .stat-gold { background: #2a2005; border-color: #b57c1f; color: #ffd700; }
        .stat-level { background: #1f8b4c; padding: 4px 8px; border-radius: 8px; }
        
        .xp-bar { width: 100%; height: 4px; background: #000; border-radius: 2px; margin-bottom: 12px; overflow: hidden; }
        .xp-fill { height: 100%; background: #ffd700; width: 0%; transition: 0.3s; }

        /* Вкладки */
        .tabs { display: flex; gap: 4px; margin-bottom: 12px; background: #0d121a; border-radius: 40px; padding: 4px; border: 1px solid #2e3948; overflow-x: auto; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { flex: 1; background: transparent; border: none; padding: 8px 2px; border-radius: 32px; font-weight: 700; font-size: 11px; color: #8a9ab0; cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .tab.active { background: #2a3a4e; color: #eef4ff; box-shadow: 0 2px 0 #0d121c; }

        .screen { background: #0a0f16; border-radius: 28px; padding: 16px 12px; min-height: 480px; max-height: 550px; overflow-y: auto; border: 1px solid #2b3545; box-shadow: inset 0 4px 14px #000000dd; }
        .screen::-webkit-scrollbar { width: 5px; }
        .screen::-webkit-scrollbar-thumb { background: #3e4b5e; border-radius: 10px; }

        /* Кнопки */
        .btn { background: #2f3b4a; border: none; border-radius: 60px; padding: 12px 16px; font-weight: 700; font-size: 13px; color: #eef4fc; cursor: pointer; box-shadow: 0 4px 0 #080c12; transition: 0.06s; text-align: center; border: 1px solid #4a5a6e; flex: 1; }
        .btn:active { transform: translateY(4px); box-shadow: 0 1px 0 #080c12; }
        .btn-green { background: #1f8b4c; border-color: #2bb36a; box-shadow: 0 4px 0 #0d4425; }
        .btn-green:active { box-shadow: 0 1px 0 #0d4425; }
        .btn-red { background: #aa3c3c; border-color: #c74a4a; box-shadow: 0 4px 0 #5e1f1f; }
        .btn-red:active { box-shadow: 0 1px 0 #5e1f1f; }
        .btn-gold { background: #b57c1f; border-color: #d99a2b; box-shadow: 0 4px 0 #6b480f; color: #fff; }
        .btn-gold:active { box-shadow: 0 1px 0 #6b480f; }
        .btn-blue { background: #2a5f8a; border-color: #3d7ab0; box-shadow: 0 4px 0 #143a58; }
        .btn:disabled { opacity: 0.4; pointer-events: none; transform: translateY(4px); box-shadow: 0 1px 0 #080c12; }

        /* Карточки рынка */
        .phone-item { background: #18202c; border-radius: 20px; padding: 13px; margin-bottom: 11px; border: 1px solid #354154; box-shadow: 0 6px 0 #080c12; cursor: pointer; display: flex; gap: 13px; align-items: center; transition: 0.1s; }
        .phone-item:active { transform: translateY(4px); box-shadow: 0 2px 0 #080c12; }
        .phone-info { flex: 1; }
        .phone-model { font-weight: 800; font-size: 15px; color: #e6f0ff; margin-bottom: 3px; }
        .phone-specs { font-size: 11px; color: #8a9ab0; margin-bottom: 5px; }
        .phone-price { font-size: 18px; font-weight: 800; color: #73c8ff; }
        .phone-price.gold { color: #ffd700; }
        
        /* РЕАЛИСТИЧНЫЕ ТЕЛЕФОНЫ (CSS) */
        .real-phone { width: 64px; height: 128px; border-radius: 12px; position: relative; flex-shrink: 0; background: #0a0a0a; border: 2px solid #1a1a1a; box-shadow: 0 8px 15px #00000088; overflow: hidden; }
        .real-phone.tablet { width: 90px; height: 128px; border-radius: 8px; }
        .r-glass { position: absolute; inset: 2px; border-radius: 10px; background: linear-gradient(145deg, #1a2a3a, #0a1520); }
        .r-screen { position: absolute; inset: 4px; border-radius: 8px; background: #061018; display: flex; align-items: center; justify-content: center; }
        .r-cam { position: absolute; top: 6px; left: 6px; width: 14px; height: 14px; background: #111; border-radius: 50%; border: 1px solid #333; display: flex; align-items: center; justify-content: center; }
        .r-cam::after { content: ''; width: 6px; height: 6px; background: #0af; border-radius: 50%; }
        .r-logo { font-size: 10px; font-weight: 900; color: rgba(255,255,255,0.1); }

        /* ЧАТ */
        .chat-box { background: #0e131c; border-radius: 18px; padding: 12px; max-height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; border: 1px solid #2b3545; margin-bottom: 12px; }
        .msg { max-width: 85%; padding: 8px 12px; border-radius: 16px; font-size: 12px; line-height: 1.4; }
        .msg.seller { background: #212e3b; color: #d0dce8; align-self: flex-start; border-bottom-left-radius: 4px; }
        .msg.me { background: #1f6f9f; color: #fff; align-self: flex-end; border-bottom-right-radius: 4px; }
        .msg.system { background: #2a2e37; color: #a0aec0; align-self: center; font-size: 10px; border-radius: 12px; padding: 4px 10px; }

        /* МАСТЕРСКАЯ */
        .workshop-area { display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center; }
        .big-phone { width: 140px; height: 280px; border-radius: 22px; background: #111; border: 3px solid #444; position: relative; box-shadow: 0 15px 35px rgba(0,0,0,0.8); transition: 0.3s; }
        .big-phone.tablet { width: 200px; height: 280px; border-radius: 14px; }
        .big-phone.opened { transform: rotateY(15deg) scale(1.02); border-color: #0af; box-shadow: 0 0 30px #0af55; }
        .big-screen { position: absolute; inset: 6px; border-radius: 16px; background: linear-gradient(135deg, #1a2a3a, #0a1520); display: flex; align-items: center; justify-content: center; font-weight: 900; color: rgba(255,255,255,0.05); font-size: 24px; }
        
        .step-box { background: #18202c; padding: 12px; border-radius: 12px; width: 100%; border: 1px solid #354154; margin-bottom: 8px; }
        .risk-bar { width: 100%; height: 6px; background: #000; border-radius: 3px; margin-top: 6px; overflow: hidden; }
        .risk-fill { height: 100%; background: linear-gradient(90deg, #0f0, #ff0, #f00); }

        /* КВЕСТЫ */
        .quest-card { background: #18202c; padding: 12px; border-radius: 12px; margin-bottom: 10px; border-left: 3px solid #ffd700; }
        .quest-title { font-size: 14px; font-weight: bold; margin-bottom: 4px; }
        .quest-desc { font-size: 11px; color: #8a9ab0; margin-bottom: 6px; }
        .quest-reward { font-size: 11px; color: #ffd700; font-weight: bold; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: #1f8b4c; padding: 10px 20px; border-radius: 20px; font-weight: bold; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 1000; box-shadow: 0 5px 15px #000; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>

<div class="game">
    <div class="top-bar">
        <div class="logo">ПЕРЕКУП ULTRA</div>
        <div class="stats">
            <div class="stat-badge money">💵 <span id="ui-money">0</span> ₽</div>
            <div class="stat-badge stat-gold">🪙 <span id="ui-gold">0</span></div>
            <div class="stat-level" id="ui-level">Ур. 1</div>
        </div>
    </div>
    <div class="xp-bar"><div class="xp-fill" id="ui-xp"></div></div>

    <div class="tabs">
        <button class="tab active" data-tab="market">🏪 Рынок</button>
        <button class="tab" data-tab="premium">💎 Премиум</button>
        <button class="tab" data-tab="workshop">🔧 Мастерская</button>
        <button class="tab" data-tab="quests">📋 Квесты</button>
    </div>

    <div class="screen" id="screen"></div>
</div>

<div class="toast" id="toast">Уведомление</div>

<script>
// ================= БАЗА ДАННЫХ =================
const PHONES_NORMAL = [
    { name: 'iPhone 7', brand: 'Apple', price: 5500, specs: '32GB, трещина', risk: 0.45, type: 'phone' },
    { name: 'Samsung A10', brand: 'Samsung', price: 6000, specs: '32GB, разбит экран', risk: 0.50, type: 'phone' },
    { name: 'Xiaomi Redmi 8', brand: 'Xiaomi', price: 7500, specs: '64GB, не включается', risk: 0.55, type: 'phone' },
    { name: 'Honor 8X', brand: 'Honor', price: 9000, specs: '128GB, батарея', risk: 0.40, type: 'phone' },
    { name: 'iPhone XR', brand: 'Apple', price: 18000, specs: '64GB, FaceID', risk: 0.35, type: 'phone' },
    { name: 'Google Pixel 4', brand: 'Google', price: 15000, specs: '64GB, модуль', risk: 0.40, type: 'phone' }
];

const PHONES_PREMIUM = [
    { name: 'iPhone 14 Pro', brand: 'Apple', price: 75000, specs: '256GB, оригинал', risk: 0.25, type: 'phone', cost: 15 },
    { name: 'Samsung S23 Ultra', brand: 'Samsung', price: 85000, specs: '512GB, AMOLED', risk: 0.20, type: 'phone', cost: 20 },
    { name: 'iPad Pro 11"', brand: 'Apple', price: 55000, specs: '128GB, M1', risk: 0.30, type: 'tablet', cost: 12 },
    { name: 'Xiaomi Pad 6', brand: 'Xiaomi', price: 35000, specs: '256GB, 144Hz', risk: 0.35, type: 'tablet', cost: 8 }
];

const SELLER_NAMES = ['Алексей', 'Андрей', 'Дмитрий', 'Сергей', 'Павел', 'Ирина', 'Максим', 'Ольга', 'Владимир', 'Екатерина'];

// ================= СОСТОЯНИЕ =================
let state = {
    money: 105000,
    gold: 10, // Стартовые монеты для интереса
    level: 1,
    xp: 0,
    xpNext: 1000,
    currentTab: 'market',
    
    // Мастерская
    activePhone: null,
    repairStage: 0, // 0-разобран, 1-замена, 2-сборка, 3-готов, -1-сломан
    hasScrewdriver: false,
    
    // Друг
    friendBorrowed: false,
    friendChat: [{ sender: 'friend', text: 'Здарова, брат! Как дела? Если что — обращайся.' }],

    // Рынок
    marketListings: [],
    activeChatListing: null,
    chatHistory: [],
    offersCount: 0,

    // Квесты
    quests: [],
    lastQuestReset: 0,
    soldCount: 0
};

// ================= УТИЛИТЫ =================
function fmt(n) { return new Intl.NumberFormat('ru-RU').format(Math.round(n)) + ' ₽'; }
function showToast(text) {
    const t = document.getElementById('toast');
    t.textContent = text; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

function addXP(amount) {
    state.xp += amount;
    if (state.xp >= state.xpNext && state.level < 45) {
        state.level++;
        state.xp -= state.xpNext;
        state.xpNext = Math.floor(state.xpNext * 1.15);
        showToast(`🎉 Уровень повышен! Теперь у вас ${state.level} ур.`);
        if (state.level === 5) showToast(`💎 Премиум рынок открыт!`);
    }
    saveGame();
}

// ================= ГЕНЕРАЦИЯ РЫНКА =================
function generateMarket() {
    state.marketListings = [];
    for (let i = 0; i < 6; i++) {
        const base = PHONES_NORMAL[Math.floor(Math.random() * PHONES_NORMAL.length)];
        const priceOffset = 0.8 + Math.random() * 0.4;
        state.marketListings.push({
            ...base,
            id: Date.now() + i,
            sellerPrice: Math.floor(base.price * priceOffset),
            sellerName: SELLER_NAMES[Math.floor(Math.random() * SELLER_NAMES.length)],
            chat: [{ sender: 'seller', text: `Продаю ${base.name}. ${base.specs}. Цена: ${fmt(base.price * priceOffset)}. Торг?` }]
        });
    }
}

// ================= КВЕСТЫ =================
function checkQuests() {
    const now = Date.now();
    const day = 24 * 60 * 60 * 1000;
    if (state.quests.length === 0 || (now - state.lastQuestReset > day)) {
        state.quests = [
            { id: 1, desc: 'Продать 15 телефонов', target: 15, current: 0, reward: 15, type: 'sell' },
            { id: 2, desc: 'Заработать 100 000 ₽', target: 100000, current: 0, reward: 25, type: 'earn' },
            { id: 3, desc: 'Починить премиум устройство', target: 1, current: 0, reward: 10, type: 'premium' }
        ];
        state.lastQuestReset = now;
        saveGame();
    }
}

function updateQuestProgress(type, amount) {
    let changed = false;
    state.quests.forEach(q => {
        if (q.type === type && q.current < q.target) {
            q.current += amount;
            if (q.current >= q.target) {
                state.gold += q.reward;
                showToast(`✅ Квест выполнен! +${q.reward} 🪙`);
            }
            changed = true;
        }
    });
    if (changed) saveGame();
}

// ================= СОХРАНЕНИЕ =================
function saveGame() {
    localStorage.setItem('perekup_ultra_v3', JSON.stringify(state));
}
function loadGame() {
    const saved = localStorage.getItem('perekup_ultra_v3');
    if (saved) state = JSON.parse(saved);
    if (!state.marketListings || state.marketListings.length === 0) generateMarket();
    if (!state.quests || state.quests.length === 0) checkQuests();
}

// ================= UI И РЕНДЕР =================
function renderPhoneCSS(brand, isTablet = false) {
    return `
        <div class="real-phone ${isTablet ? 'tablet' : ''}">
            <div class="r-glass">
                <div class="r-cam"></div>
                <div class="r-screen"><div class="r-logo">${brand}</div></div>
            </div>
        </div>
    `;
}

function updateHeader() {
    document.getElementById('ui-money').textContent = state.money.toLocaleString('ru-RU');
    document.getElementById('ui-gold').textContent = state.gold;
    document.getElementById('ui-level').textContent = 'Ур. ' + state.level;
    document.getElementById('ui-xp').style.width = Math.min(100, (state.xp / state.xpNext) * 100) + '%';
}

function render() {
    updateHeader();
    const screen = document.getElementById('screen');
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.currentTab));

    if (state.currentTab === 'market') renderMarket(screen);
    if (state.currentTab === 'premium') renderPremium(screen);
    if (state.currentTab === 'workshop') renderWorkshop(screen);
    if (state.currentTab === 'quests') renderQuests(screen);
}

// 1. ОБЫЧНЫЙ РЫНОК (С ЧАТОМ)
function renderMarket(screen) {
    if (state.activeChatListing) return renderChat(screen);

    let html = `<h3 style="margin-bottom:10px; font-size:16px;">🏪 Объявления на Перекупе</h3>`;
    state.marketListings.forEach(item => {
        html += `
            <div class="phone-item" onclick="openChat(${item.id})">
                ${renderPhoneCSS(item.brand)}
                <div class="phone-info">
                    <div class="phone-model">${item.name}</div>
                    <div class="phone-specs">${item.specs}</div>
                    <div class="phone-price">${fmt(item.sellerPrice)}</div>
                    <div style="font-size:10px; color:#8a9ab0; margin-top:4px;">👤 ${item.sellerName}</div>
                </div>
            </div>
        `;
    });
    html += `<button class="btn btn-blue" style="margin-top:10px;" onclick="refreshMarket()">🔄 Обновить объявления</button>`;
    html += `<button class="btn btn-gold" style="margin-top:8px;" onclick="openFriendChat()">💬 Написать другу Вадиму</button>`;
    screen.innerHTML = html;
}

function openChat(id) {
    state.activeChatListing = state.marketListings.find(x => x.id === id);
    state.chatHistory = [...state.activeChatListing.chat];
    state.offersCount = 0;
    render();
}

function renderChat(screen) {
    const l = state.activeChatListing;
    let chatHtml = state.chatHistory.map(m => `<div class="msg ${m.sender}">${m.text}</div>`).join('');
    
    screen.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <b>${l.name}</b>
            <button class="btn" style="flex:0; padding:4px 10px;" onclick="state.activeChatListing=null; render();">Назад</button>
        </div>
        <div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">
            ${renderPhoneCSS(l.brand)}
            <div>
                <div class="phone-price">${fmt(l.sellerPrice)}</div>
                <div class="phone-specs">${l.specs}</div>
            </div>
        </div>
        <div class="chat-box">${chatHtml}</div>
        <div style="display:flex; gap:8px;">
            <button class="btn btn-gold" onclick="bargain()" ${state.offersCount >= 3 ? 'disabled' : ''}>Торг (${state.offersCount}/3)</button>
            <button class="btn btn-green" onclick="buyFromMarket()">Купить</button>
        </div>
    `;
    setTimeout(() => { const box = document.querySelector('.chat-box'); if (box) box.scrollTop = box.scrollHeight; }, 50);
}

window.refreshMarket = function() { generateMarket(); render(); saveGame(); };

window.bargain = function() {
    const l = state.activeChatListing;
    state.offersCount++;
    const newPrice = Math.floor(l.sellerPrice * (0.85 + Math.random() * 0.1));
    state.chatHistory.push({ sender: 'me', text: `Может, отдашь за ${fmt(newPrice)}?` });
    
    if (Math.random() > 0.3) {
        l.sellerPrice = newPrice;
        state.chatHistory.push({ sender: 'seller', text: `Ладно, договорились. Забирай за ${fmt(newPrice)}.` });
    } else {
        state.chatHistory.push({ sender: 'seller', text: `Нет, брат, это слишком мало.` });
    }
    render();
};

window.buyFromMarket = function() {
    const l = state.activeChatListing;
    if (state.money < l.sellerPrice) return showToast('Мало денег!');
    if (state.activePhone) return showToast('Мастерская занята! Продай старый телефон.');
    
    state.money -= l.sellerPrice;
    state.marketListings = state.marketListings.filter(x => x.id !== l.id);
    state.activeChatListing = null;
    
    // Перенос в мастерскую
    state.activePhone = { ...l };
    state.repairStage = 0;
    state.hasScrewdriver = false;
    
    showToast('Телефон куплен! Перейди в Мастерскую.');
    state.currentTab = 'workshop';
    updateQuestProgress('buy', 1);
    saveGame(); render();
};

// ДРУГ ВАДИМ
window.openFriendChat = function() {
    let chatHtml = state.friendChat.map(m => `<div class="msg ${m.sender}">${m.text}</div>`).join('');
    const canBorrow = !state.friendBorrowed;
    const canRepay = state.friendBorrowed && state.money >= 10000;

    state.activeChatListing = null; // Сбрасываем рыночный чат
    const screen = document.getElementById('screen');
    screen.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <b>👤 Вадим</b>
            <button class="btn" style="flex:0; padding:4px 10px;" onclick="render()">Назад</button>
        </div>
        <div class="chat-box">${chatHtml}</div>
        <div style="display:flex; gap:8px;">
            ${canBorrow ? `<button class="btn btn-blue" onclick="borrowMoney()">Попросить 10 000 ₽</button>` : ''}
            ${state.friendBorrowed ? `<button class="btn btn-green" onclick="repayMoney()" ${!canRepay ? 'disabled' : ''}>Вернуть долг</button>` : ''}
        </div>
    `;
    setTimeout(() => { const box = document.querySelector('.chat-box'); if (box) box.scrollTop = box.scrollHeight; }, 50);
};

window.borrowMoney = function() {
    if (state.friendBorrowed) return;
    state.money += 10000; state.friendBorrowed = true;
    state.friendChat.push({ sender: 'me', text: 'Вадим, выручай, не хватает!' });
    state.friendChat.push({ sender: 'friend', text: 'Ладно, брат, кидаю 10к. Но ты верни!' });
    saveGame(); openFriendChat(); updateHeader();
};

window.repayMoney = function() {
    if (!state.friendBorrowed || state.money < 10000) return;
    state.money -= 10000; state.friendBorrowed = false;
    state.friendChat.push({ sender: 'me', text: 'Держи долг, спасибо!' });
    state.friendChat.push({ sender: 'friend', text: 'Красава! Если что, обращайся.' });
    saveGame(); openFriendChat(); updateHeader();
};

// 2. ПРЕМИУМ РЫНОК
function renderPremium(screen) {
    if (state.level < 5) {
        return screen.innerHTML = `<div style="text-align:center; padding:50px; color:#8a9ab0;">💎 Премиум рынок откроется на 5 уровне!<br><br>Твой уровень: ${state.level}</div>`;
    }
    let html = `<h3 style="margin-bottom:10px; font-size:16px; color:#ffd700;">💎 Премиум Рынок</h3>`;
    html += `<p style="font-size:11px; color:#8a9ab0; margin-bottom:10px;">Планшеты и топовые флагманы за Золотые Монеты 🪙</p>`;
    
    PHONES_PREMIUM.forEach(item => {
        const canBuy = state.gold >= item.cost && !state.activePhone;
        html += `
            <div class="phone-item">
                ${renderPhoneCSS(item.brand, item.type === 'tablet')}
                <div class="phone-info">
                    <div class="phone-model">${item.name} ${item.type==='tablet'?'[Планшет]':''}</div>
                    <div class="phone-specs">${item.specs}</div>
                    <div class="phone-price gold">${item.cost} 🪙</div>
                </div>
                <button class="btn btn-gold" onclick="buyPremium('${item.name}')" ${!canBuy ? 'disabled' : ''}>Купить</button>
            </div>
        `;
    });
    screen.innerHTML = html;
}

window.buyPremium = function(name) {
    const p = PHONES_PREMIUM.find(x => x.name === name);
    if (state.gold < p.cost || state.activePhone) return;
    
    state.gold -= p.cost;
    state.activePhone = { ...p };
    state.repairStage = 0;
    state.hasScrewdriver = false;
    showToast('Премиум устройство куплено!');
    state.currentTab = 'workshop';
    saveGame(); render();
};

// 3. МАСТЕРСКАЯ (СЛОЖНЫЙ РЕМОНТ)
function renderWorkshop(screen) {
    if (!state.activePhone) {
        return screen.innerHTML = `<div style="text-align:center; padding:50px; color:#8a9ab0;"><div style="font-size:40px; margin-bottom:10px;">🔧</div>Мастерская пуста.<br>Купи устройство на рынке.</div>`;
    }
    
    const p = state.activePhone;
    const isTablet = p.type === 'tablet';
    let currentRisk = p.risk;
    
    // Этапы
    let html = `<div class="workshop-area">`;
    html += `<h3>${p.name} ${isTablet ? '📟' : ''}</h3>`;
    html += `<div class="big-phone ${state.repairStage > 0 ? 'opened' : ''} ${isTablet ? 'tablet' : ''}"><div class="big-screen">${p.brand}</div></div>`;
    
    // Прогресс бар
    html += `<div class="step-box">
        <div style="font-size:12px; font-weight:bold; margin-bottom:5px;">
            ${state.repairStage === 0 ? 'Шаг 1: Разборка корпуса' : 
              state.repairStage === 1 ? 'Шаг 2: Замена запчасти' : 
              state.repairStage === 2 ? 'Шаг 3: Сборка и тест' : 
              state.repairStage === 3 ? '✅ Успешно починен!' : '💥 СЛОМАН'}
        </div>
        <div style="font-size:11px; color:#8a9ab0;">Базовый риск: ${Math.round(currentRisk*100)}%</div>
        <div class="risk-bar"><div class="risk-fill" style="width:${currentRisk*100}%"></div></div>
    </div>`;

    // Кнопки действий
    if (state.repairStage === 0) {
        if (!state.hasScrewdriver) {
            html += `<button class="btn btn-gold" onclick="buyTool()">Купить отвёртку (1000 ₽)</button>`;
        } else {
            html += `<button class="btn btn-blue" onclick="doRepairStep(0.1)">Открутить винты</button>`;
        }
    } else if (state.repairStage === 1) {
        html += `<button class="btn btn-blue" onclick="doRepairStep(0.15)">Заменить деталь (1500 ₽)</button>`;
    } else if (state.repairStage === 2) {
        html += `<button class="btn btn-blue" onclick="doRepairStep(0.2)">Собрать и включить</button>`;
    } else if (state.repairStage === 3) {
        const sellPrice = Math.floor(p.price * 1.8) + (isTablet ? 10000 : 0);
        html += `<button class="btn btn-green" onclick="sellRepairedPhone(${sellPrice})">💰 Продать за ${fmt(sellPrice)}</button>`;
    } else if (state.repairStage === -1) {
        html += `<button class="btn btn-red" onclick="scrapPhone()">🗑️ Сдать на запчасти (2000 ₽)</button>`;
    }
    
    // Если вещь сломана, только сдать
    if (state.repairStage === -1) {
        html = `<div class="workshop-area"><h3>${p.name}</h3><h1 style="font-size:50px;">💔</h1><p style="color:#f88;">Устройство не подлежит ремонту.</p>
        <button class="btn btn-red" onclick="scrapPhone()">Сдать на запчасти (2000 ₽)</button></div>`;
    }

    html += `</div>`;
    screen.innerHTML = html;
}

window.buyTool = function() {
    if (state.money < 1000) return showToast('Нужно 1000 ₽ на отвёртку!');
    state.money -= 1000;
    state.hasScrewdriver = true;
    saveGame(); render();
};

window.doRepairStep = function(extraRisk) {
    const p = state.activePhone;
    
    // Проверка денег на деталь
    if (state.repairStage === 1) {
        if (state.money < 1500) return showToast('Не хватает 1500 ₽ на запчасть!');
        state.money -= 1500;
    }

    const totalRisk = p.risk + extraRisk;
    if (Math.random() < totalRisk) {
        // Сломал
        state.repairStage = -1;
        showToast('💥 Хруст... Ты сломал устройство!');
    } else {
        // Успех
        state.repairStage++;
        if (state.repairStage === 3) showToast('✅ Устройство работает!');
        else showToast('⚙️ Этап пройден.');
    }
    saveGame(); render();
};

window.sellRepairedPhone = function(price) {
    state.money += price;
    state.soldCount++;
    addXP(state.activePhone.type === 'tablet' ? 300 : 150);
    updateQuestProgress('sell', 1);
    updateQuestProgress('earn', price);
    if (state.activePhone.type === 'tablet') updateQuestProgress('premium', 1);
    
    showToast(`💰 Продано за ${fmt(price)}!`);
    state.activePhone = null;
    state.currentTab = 'market';
    saveGame(); render();
};

window.scrapPhone = function() {
    state.money += 2000;
    addXP(50);
    showToast('💸 Сдано на запчасти (2000 ₽)');
    state.activePhone = null;
    state.currentTab = 'market';
    saveGame(); render();
};

// 4. КВЕСТЫ
function renderQuests(screen) {
    let html = `<h3 style="margin-bottom:10px; font-size:16px;">📋 Ежедневные Задания</h3>`;
    html += `<p style="font-size:11px; color:#8a9ab0; margin-bottom:12px;">Обновляются раз в 24 часа. Выполняй и получай золото 🪙</p>`;
    
    state.quests.forEach(q => {
        const isDone = q.current >= q.target;
        html += `
            <div class="quest-card" style="${isDone ? 'border-left-color:#0f0; opacity:0.7;' : ''}">
                <div class="quest-title">${q.desc}</div>
                <div class="quest-desc">Прогресс: ${Math.min(q.current, q.target)} / ${q.target}</div>
                <div class="quest-reward">Награда: ${q.reward} 🪙 ${isDone ? '(Выполнено)' : ''}</div>
            </div>
        `;
    });
    
    // Кнопка сброса для теста (можно удалить в финале)
    html += `<button class="btn btn-red" style="margin-top:15px; font-size:10px;" onclick="forceResetQuests()">⚠️ Принудительно обновить квесты</button>`;
    
    screen.innerHTML = html;
}

window.forceResetQuests = function() {
    state.lastQuestReset = 0;
    checkQuests();
    saveGame(); render();
};

// ================= НАВИГАЦИЯ И СТАРТ =================
document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
        state.currentTab = t.dataset.tab;
        render();
    });
});

loadGame();
render();

</script>
</body>
</html>
