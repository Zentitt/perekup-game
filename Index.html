<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ПЕРЕКУП УЛЬТРА 5.1</title>
    <style>
        :root {
            --bg: #050810;
            --panel: rgba(18, 26, 43, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --cyan: #00f3ff;
            --green: #00ff88;
            --red: #ff3366;
            --gold: #ffcc00;
            --text: #f1f5f9;
            --muted: #8b9eb7;
            
            --r-common: #94a3b8;
            --r-rare: #3b82f6;
            --r-epic: #a855f7;
            --r-legend: #f59e0b;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; user-select: none; }
        body { background: radial-gradient(circle at 50% 0%, #111c2e 0%, #020408 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 10px; color: var(--text); overflow: hidden; }
        
        .game { max-width: 600px; width: 100%; height: 95vh; max-height: 850px; background: var(--panel); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border-radius: 28px; padding: 15px; border: 1px solid var(--border); box-shadow: 0 30px 60px rgba(0,0,0,0.9), inset 0 1px 0 rgba(255,255,255,0.1); display: flex; flex-direction: column; gap: 10px; }

        /* HEADER */
        .header { display: flex; justify-content: space-between; align-items: center; background: rgba(0,0,0,0.5); padding: 10px 16px; border-radius: 18px; border: 1px solid var(--border); }
        .logo { font-weight: 900; font-size: 15px; background: linear-gradient(90deg, var(--cyan), #a855f7); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: 1px; }
        .stats { display: flex; gap: 12px; font-size: 14px; font-weight: 900; }
        .stat.money { color: var(--green); text-shadow: 0 0 10px rgba(0,255,136,0.3); }
        
        .xp-bar { width: 100%; height: 4px; background: #000; border-radius: 2px; margin-top: 4px; overflow: hidden; }
        .xp-fill { height: 100%; background: var(--cyan); width: 0%; transition: 0.3s; box-shadow: 0 0 10px var(--cyan); }

        /* TABS */
        .tabs { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
        .tabs::-webkit-scrollbar { display: none; }
        .tab { flex: 1; background: rgba(255,255,255,0.03); padding: 10px 5px; border-radius: 12px; text-align: center; font-size: 10px; font-weight: 800; color: var(--muted); border: 1px solid var(--border); cursor: pointer; white-space: nowrap; transition: 0.2s; }
        .tab.active { background: rgba(0, 243, 255, 0.1); color: var(--cyan); border-color: var(--cyan); box-shadow: 0 0 10px rgba(0,243,255,0.2); }

        /* SCREEN */
        .screen { flex: 1; background: rgba(0,0,0,0.4); border-radius: 20px; padding: 12px; overflow-y: auto; border: 1px solid var(--border); position: relative; }
        .screen::-webkit-scrollbar { width: 4px; }
        .screen::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }

        /* ================= УЛЬТРА-МОДЕЛИ ТЕЛЕФОНОВ ================= */
        .device-container { perspective: 1000px; display: flex; justify-content: center; align-items: center; padding: 10px; }
        
        .real-phone {
            width: 76px; height: 155px; border-radius: 18px; position: relative;
            background: linear-gradient(135deg, #475569, #1e293b);
            border: 2px solid #64748b;
            box-shadow: -10px 15px 35px rgba(0,0,0,0.8), inset 0 2px 4px rgba(255,255,255,0.3);
            transform: rotateY(-18deg) rotateX(6deg); transition: 0.3s; overflow: hidden;
        }
        .real-phone.tablet { width: 115px; height: 150px; border-radius: 12px; }
        
        /* Цвета корпуса */
        .real-phone.apple { background: linear-gradient(135deg, #71717a, #18181b); border-color: #a1a1aa; }
        .real-phone.samsung { background: linear-gradient(135deg, #4338ca, #1e1b4b); border-color: #6366f1; }
        .real-phone.xiaomi { background: linear-gradient(135deg, #9a3412, #431407); border-color: #ea580c; }
        .real-phone.google { background: linear-gradient(135deg, #1d4ed8, #172554); border-color: #3b82f6; }

        /* Боковые кнопки */
        .side-btn { position: absolute; width: 2px; background: #333; border-radius: 2px; box-shadow: 1px 0 2px rgba(0,0,0,0.5); }
        .side-btn.power { right: -2px; top: 40px; height: 30px; background: #52525b; }
        .side-btn.vol-up { left: -2px; top: 30px; height: 20px; background: #52525b; }
        .side-btn.vol-down { left: -2px; top: 55px; height: 20px; background: #52525b; }

        /* Экран */
        .screen-glass { position: absolute; inset: 3px; border-radius: 15px; background: #000; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .wallpaper { position: absolute; inset: 0; background: linear-gradient(45deg, #0f172a, #1e293b, #0f172a); background-size: 200% 200%; animation: bgMove 5s infinite alternate; }
        @keyframes bgMove { 0% { background-position: 0% 0%; } 100% { background-position: 100% 100%; } }
        
        .screen-glass::after { content: ''; position: absolute; top: -50%; left: -100%; width: 200%; height: 200%; background: linear-gradient(to right, transparent, rgba(255,255,255,0.15), transparent); transform: rotate(35deg); animation: shine 3.5s infinite; }
        @keyframes shine { 0% { transform: translateX(-100%) rotate(35deg); } 25% { transform: translateX(100%) rotate(35deg); } 100% { transform: translateX(100%) rotate(35deg); } }
        
        .dynamic-island { position: absolute; top: 6px; left: 50%; transform: translateX(-50%); width: 28px; height: 8px; background: #000; border-radius: 10px; z-index: 10; border: 1px solid #222; }
        .dynamic-island::after { content: ''; position: absolute; right: 4px; top: 2px; width: 4px; height: 4px; background: #0af; border-radius: 50%; box-shadow: 0 0 4px #0af; }
        
        .cam-module { position: absolute; top: 8px; left: 8px; width: 34px; height: 34px; background: #09090b; border-radius: 10px; border: 1px solid #3f3f46; display: flex; flex-wrap: wrap; padding: 3px; gap: 2px; align-items: center; justify-content: center; z-index: 15; box-shadow: 2px 2px 8px rgba(0,0,0,0.8); }
        .lens { width: 11px; height: 11px; background: radial-gradient(circle at 30% 30%, #00f3ff, #000); border-radius: 50%; border: 1px solid #52525b; box-shadow: inset 0 0 3px #000; }
        .lens.small { width: 7px; height: 7px; }
        .flash { width: 4px; height: 4px; background: #fff; border-radius: 50%; box-shadow: 0 0 3px #fff; }
        
        .brand-logo { font-size: 20px; font-weight: 900; color: rgba(255,255,255,0.1); letter-spacing: -1px; z-index: 2; text-shadow: 0 2px 5px rgba(0,0,0,0.5); }

        /* --- АНИМАЦИЯ РЕМОНТА --- */
        .repairing { animation: shake 0.3s infinite; box-shadow: 0 0 30px var(--cyan); border-color: var(--cyan); }
        @keyframes shake { 0% { transform: translate(1px, 1px) rotate(0deg); } 25% { transform: translate(-2px, -1px) rotate(-1deg); } 50% { transform: translate(2px, 2px) rotate(1deg); } 75% { transform: translate(-1px, 2px) rotate(0deg); } 100% { transform: translate(1px, -2px) rotate(-1deg); } }

        .scan-line { position: absolute; left: 0; right: 0; height: 3px; background: var(--cyan); box-shadow: 0 0 15px var(--cyan); z-index: 99; opacity: 0; }
        .scanning .scan-line { animation: scan 0.6s ease-in-out infinite alternate; opacity: 1; }
        @keyframes scan { 0% { top: 5%; } 100% { top: 95%; } }

        .sparks { position: absolute; inset: 0; pointer-events: none; z-index: 100; display: flex; justify-content: center; align-items: center; opacity: 0; }
        .spark { position: absolute; font-size: 18px; animation: fly 0.5s ease-out forwards; filter: drop-shadow(0 0 5px var(--cyan)); }
        @keyframes fly { 0% { transform: scale(0.5) translate(0, 0); opacity: 1; } 100% { transform: scale(1.5) translate(var(--x), var(--y)); opacity: 0; } }

        /* MARKET GRID */
        .market-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .market-card { background: rgba(15, 23, 42, 0.9); border-radius: 16px; padding: 12px 8px; border: 1px solid var(--border); display: flex; flex-direction: column; align-items: center; text-align: center; transition: 0.1s; position: relative; }
        .market-card:active { transform: scale(0.96); }
        .mc-title { font-size: 11px; font-weight: 900; margin-top: 6px; color: #fff; }
        .mc-price { font-size: 13px; font-weight: 900; color: var(--cyan); margin-top: 4px; text-shadow: 0 0 8px rgba(0,243,255,0.4); }

        /* БЕЙДЖИ РЕДКОСТИ */
        .mc-rarity { font-size: 9px; font-weight: 900; padding: 2px 6px; border-radius: 4px; margin-top: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
        .rar-common .mc-rarity { background: rgba(148,163,184,0.2); color: var(--r-common); border: 1px solid rgba(148,163,184,0.3); }
        .rar-rare .mc-rarity { background: rgba(59,130,246,0.2); color: var(--r-rare); border: 1px solid rgba(59,130,246,0.3); }
        .rar-epic .mc-rarity { background: rgba(168,85,247,0.2); color: var(--r-epic); border: 1px solid rgba(168,85,247,0.3); }
        .rar-legend .mc-rarity { background: rgba(245,158,11,0.2); color: var(--r-legend); border: 1px solid rgba(245,158,11,0.3); box-shadow: 0 0 10px rgba(245,158,11,0.2); }

        /* КНОПКИ */
        .btn { background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 12px; padding: 10px 15px; font-weight: 800; font-size: 12px; color: #fff; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn:active { transform: scale(0.95); }
        .btn:disabled { opacity: 0.3; pointer-events: none; }
        .btn-cyan { background: rgba(0, 243, 255, 0.1); border-color: var(--cyan); color: var(--cyan); }
        .btn-green { background: rgba(0, 255, 136, 0.1); border-color: var(--green); color: var(--green); }
        .btn-red { background: rgba(255, 51, 102, 0.1); border-color: var(--red); color: var(--red); }

        /* МАСТЕРСКАЯ */
        .workbench { display: flex; flex-direction: column; align-items: center; gap: 10px; }
        .repair-panel { background: rgba(0,0,0,0.5); border-radius: 16px; padding: 15px; width: 100%; border: 1px solid var(--border); text-align: center; position: relative; overflow: hidden; }
        .risk-bar { width: 100%; height: 6px; background: #000; border-radius: 3px; margin: 10px 0; overflow: hidden; border: 1px solid #333; }
        .risk-fill { height: 100%; background: linear-gradient(90deg, var(--green), var(--gold), var(--red)); }
        
        .ws-list-item { display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.03); padding: 10px; border-radius: 12px; margin-bottom: 8px; border: 1px solid var(--border); cursor: pointer; }

        /* МАГАЗИН */
        .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .part-card { background: rgba(15, 23, 42, 0.9); border: 1px solid var(--border); border-radius: 12px; padding: 10px; text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .part-icon { font-size: 24px; margin-bottom: 4px; }
        .part-name { font-size: 10px; font-weight: 800; line-height: 1.2; }
        .part-price { font-size: 11px; font-weight: 900; color: var(--cyan); margin: 6px 0; }

        /* КВЕСТЫ / ЧАТ */
        .quest-card { background: rgba(255,255,255,0.03); padding: 12px; border-radius: 12px; margin-bottom: 8px; border-left: 3px solid var(--gold); }
        .chat-box { background: rgba(0,0,0,0.4); border-radius: 14px; padding: 12px; height: 180px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; border: 1px solid var(--border); margin-bottom: 10px; }
        .msg { max-width: 85%; padding: 8px 12px; border-radius: 14px; font-size: 11px; line-height: 1.4; }
        .msg.seller { background: rgba(255,255,255,0.1); align-self: flex-start; border-bottom-left-radius: 2px; }
        .msg.me { background: rgba(0, 243, 255, 0.15); border: 1px solid rgba(0,243,255,0.3); align-self: flex-end; border-bottom-right-radius: 2px; color: #b3f0ff; }

        .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--cyan); color: #000; padding: 10px 20px; border-radius: 20px; font-weight: 900; opacity: 0; transition: 0.3s; pointer-events: none; z-index: 1000; font-size: 12px; box-shadow: 0 10px 30px rgba(0,243,255,0.4); }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(10px); }
    </style>
</head>
<body>

<div class="game">
    <div class="header">
        <div class="logo">ПЕРЕКУП УЛЬТРА</div>
        <div class="stats">
            <div class="stat money">💵 <span id="ui-money">0</span></div>
            <div class="stat level">Ур. <span id="ui-level">1</span></div>
        </div>
    </div>
    <div class="xp-bar"><div class="xp-fill" id="ui-xp"></div></div>

    <div class="tabs">
        <div class="tab active" data-tab="market">🏪 Рынок</div>
        <div class="tab" data-tab="workshop">🔧 Мастерская</div>
        <div class="tab" data-tab="shop">🛒 Запчасти</div>
        <div class="tab" data-tab="cases">📦 Кейсы</div>
        <div class="tab" data-tab="quests">📋 Квесты</div>
    </div>

    <div class="screen" id="screen"></div>
</div>

<div class="toast" id="toast">Уведомление</div>

<script>
// ================= БАЗА ДАННЫХ =================
const RARITY = {
    common: { name: 'Обычный', color: 'var(--r-common)', weight: 65 },
    rare: { name: 'Редкий', color: 'var(--r-rare)', weight: 56 },
    epic: { name: 'Эпический', color: 'var(--r-epic)', weight: 43 },
    legend: { name: 'Легендарный', color: 'var(--r-legend)', weight: 25 }
};

const PHONE_DB = [
    // COMMON
    { model: 'iPhone 6s', brand: 'apple', basePrice: 8000, risk: 0.20, type: 'phone', rar: 'common' },
    { model: 'iPhone 7', brand: 'apple', basePrice: 10000, risk: 0.18, type: 'phone', rar: 'common' },
    { model: 'Samsung J5', brand: 'samsung', basePrice: 6000, risk: 0.22, type: 'phone', rar: 'common' },
    { model: 'Samsung A10', brand: 'samsung', basePrice: 7500, risk: 0.21, type: 'phone', rar: 'common' },
    { model: 'Xiaomi Redmi 7', brand: 'xiaomi', basePrice: 6500, risk: 0.22, type: 'phone', rar: 'common' },
    { model: 'Xiaomi Redmi 8', brand: 'xiaomi', basePrice: 8000, risk: 0.20, type: 'phone', rar: 'common' },
    { model: 'Honor 7A', brand: 'honor', basePrice: 5000, risk: 0.25, type: 'phone', rar: 'common' },
    // RARE
    { model: 'iPhone X', brand: 'apple', basePrice: 22000, risk: 0.15, type: 'phone', rar: 'rare' },
    { model: 'iPhone XR', brand: 'apple', basePrice: 26000, risk: 0.14, type: 'phone', rar: 'rare' },
    { model: 'Samsung A52', brand: 'samsung', basePrice: 20000, risk: 0.16, type: 'phone', rar: 'rare' },
    { model: 'Xiaomi Poco X3', brand: 'xiaomi', basePrice: 18000, risk: 0.17, type: 'phone', rar: 'rare' },
    { model: 'Google Pixel 4a', brand: 'google', basePrice: 19000, risk: 0.15, type: 'phone', rar: 'rare' },
    // EPIC
    { model: 'iPhone 12', brand: 'apple', basePrice: 55000, risk: 0.10, type: 'phone', rar: 'epic' },
    { model: 'iPhone 13', brand: 'apple', basePrice: 65000, risk: 0.09, type: 'phone', rar: 'epic' },
    { model: 'Samsung S22', brand: 'samsung', basePrice: 60000, risk: 0.11, type: 'phone', rar: 'epic' },
    { model: 'Xiaomi 12', brand: 'xiaomi', basePrice: 50000, risk: 0.12, type: 'phone', rar: 'epic' },
    { model: 'iPad Air 4', brand: 'apple', basePrice: 60000, risk: 0.09, type: 'tablet', rar: 'epic' },
    // LEGEND
    { model: 'iPhone 15 Pro', brand: 'apple', basePrice: 150000, risk: 0.06, type: 'phone', rar: 'legend' },
    { model: 'Samsung S23 Ultra', brand: 'samsung', basePrice: 140000, risk: 0.07, type: 'phone', rar: 'legend' },
    { model: 'Google Pixel 8', brand: 'google', basePrice: 110000, risk: 0.08, type: 'phone', rar: 'legend' },
    { model: 'iPad Pro M2', brand: 'apple', basePrice: 130000, risk: 0.07, type: 'tablet', rar: 'legend' }
];

const PARTS_SHOP = [
    { id: 'screwdriver', name: 'Отвёртка', icon: '🪛', price: 1500 },
    { id: 'screen_oled', name: 'Экран OLED', icon: '📱', price: 6000 },
    { id: 'screen_lcd', name: 'Экран LCD', icon: '🖥️', price: 3000 },
    { id: 'battery', name: 'Батарея', icon: '🔋', price: 2500 },
    { id: 'camera_main', name: 'Камера', icon: '📷', price: 3500 },
    { id: 'camera_front', name: 'Фронт-камера', icon: '🤳', price: 1500 },
    { id: 'charging_port', name: 'Разъём', icon: '🔌', price: 1500 },
    { id: 'speaker', name: 'Динамик', icon: '🔊', price: 1200 },
    { id: 'back_glass', name: 'Крышка', icon: '🛡️', price: 2000 },
    { id: 'motherboard', name: 'Мат. плата', icon: '💻', price: 8000 },
    { id: 'flex_cable', name: 'Шлейф', icon: '🔗', price: 1000 },
    { id: 'face_id', name: 'FaceID', icon: '👁️', price: 4000 }
];

const SELLER_NAMES = ['Алексей', 'Андрей', 'Дмитрий', 'Сергей', 'Павел', 'Ирина', 'Максим', 'Ольга'];

// ================= СОСТОЯНИЕ =================
let state = {
    money: 50000,
    level: 1,
    xp: 0,
    xpNext: 2000,
    currentTab: 'market',
    
    totalEarned: 0,
    inventory: { screwdriver: 0, screen_oled: 0, screen_lcd: 0, battery: 0, camera_main: 0, camera_front: 0, charging_port: 0, speaker: 0, back_glass: 0, motherboard: 0, flex_cable: 0, face_id: 0 },
    
    workshopPhones: [],
    selectedPhoneId: null,
    
    cases: { bum: 1, good: 0, premium: 0 },
    
    marketListings: [],
    activeChat: null,
    chatHistory: [],
    offersCount: 0,
    
    friendBorrowed: false,
    friendChat: [{ sender: 'friend', text: 'Здарова! Если нужны деньги на закуп — пиши.' }],
    
    quests: [],
    lastQuestReset: 0,
    nextId: 1
};

// ================= УТИЛИТЫ =================
function fmt(n) { return new Intl.NumberFormat('ru-RU').format(Math.round(n)); }
function showToast(text) {
    const t = document.getElementById('toast');
    t.textContent = text; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
}

function addMoney(amount) {
    state.money += amount;
    state.totalEarned += amount; 
    saveGame();
}

function addXP(amount) {
    state.xp += amount;
    if (state.xp >= state.xpNext && state.level < 50) {
        state.level++;
        state.xp -= state.xpNext;
        state.xpNext = Math.floor(state.xpNext * 1.2);
        showToast(`🎉 Уровень ${state.level}!`);
    }
    saveGame();
}

function saveGame() { localStorage.setItem('perekup_ultra_v8', JSON.stringify(state)); }
function loadGame() {
    const saved = localStorage.getItem('perekup_ultra_v8');
    if (saved) state = JSON.parse(saved);
    if (!state.marketListings || state.marketListings.length === 0) fillMarket();
    checkQuests();
}

// ================= АВТО-РЫНОК =================
function fillMarket() {
    const usedModels = new Set(state.marketListings.map(p => p.model));
    
    while(state.marketListings.length < 8) {
        const totalWeight = RARITY.common.weight + RARITY.rare.weight + RARITY.epic.weight + RARITY.legend.weight;
        let random = Math.random() * totalWeight;
        let selectedRar = 'common';
        if (random < RARITY.common.weight) selectedRar = 'common';
        else if (random < RARITY.common.weight + RARITY.rare.weight) selectedRar = 'rare';
        else if (random < RARITY.common.weight + RARITY.rare.weight + RARITY.epic.weight) selectedRar = 'epic';
        else selectedRar = 'legend';
        
        const pool = PHONE_DB.filter(p => p.rar === selectedRar && !usedModels.has(p.model));
        if (pool.length === 0) continue;

        const base = pool[Math.floor(Math.random() * pool.length)];
        usedModels.add(base.model);
        
        state.marketListings.push({
            ...base, id: Date.now() + Math.random(),
            sellerPrice: Math.floor(base.basePrice * (0.95 + Math.random() * 0.2)),
            sellerName: SELLER_NAMES[Math.floor(Math.random() * SELLER_NAMES.length)],
            repairStage: 0
        });
    }
}

// ================= КВЕСТЫ =================
function checkQuests() {
    const now = Date.now();
    if (state.quests.length === 0 || (now - state.lastQuestReset > 86400000)) {
        state.quests = [
            { id: 1, desc: 'Продать 3 устройства', target: 3, current: 0, type: 'sell' },
            { id: 2, desc: 'Заработать 40 000 ₽', target: 40000, current: 0, type: 'earn_daily' },
            { id: 3, desc: 'Накопить 1 000 000 ₽', target: 1000000, current: state.totalEarned, type: 'milestone_good', rewardCase: 'good' },
            { id: 4, desc: 'Накопить 5 000 000 ₽', target: 5000000, current: state.totalEarned, type: 'milestone_premium', rewardCase: 'premium' }
        ];
        state.lastQuestReset = now;
        saveGame();
    }
}

function updateQuest(type, amount) {
    state.quests.forEach(q => {
        if (q.type === type && q.current < q.target) {
            q.current += amount;
            if (q.current >= q.target) {
                addMoney(5000);
                showToast(`✅ Квест выполнен! +5000 ₽`);
            }
        }
    });
    let qGood = state.quests.find(q => q.type === 'milestone_good');
    let qPrem = state.quests.find(q => q.type === 'milestone_premium');
    if (qGood && !qGood.claimed && state.totalEarned >= 1000000) {
        qGood.claimed = true; state.cases.good += 1; showToast('🏆 Выдан Хороший Кейс!');
    }
    if (qPrem && !qPrem.claimed && state.totalEarned >= 5000000) {
        qPrem.claimed = true; state.cases.premium += 1; showToast('👑 Выдан Премиум Кейс!');
    }
    saveGame();
}

// ================= РЕНДЕР =================
function updateHeader() {
    document.getElementById('ui-money').textContent = fmt(state.money);
    document.getElementById('ui-level').textContent = state.level;
    document.getElementById('ui-xp').style.width = Math.min(100, (state.xp / state.xpNext) * 100) + '%';
}

function renderDevice(brand, rar, isTablet = false) {
    const brandLogos = { 'apple': '', 'samsung': 'S', 'xiaomi': 'MI', 'google': 'G', 'honor': 'H' };
    const logo = brandLogos[brand] || brand.charAt(0).toUpperCase();
    
    let lenses = `<div class="lens"></div><div class="lens"></div><div class="flash"></div>`;
    if (rar === 'epic' || rar === 'legend') lenses = `<div class="lens"></div><div class="lens"></div><div class="lens small"></div><div class="flash"></div>`;
    
    return `
        <div class="device-container">
            <div class="real-phone ${brand} ${isTablet ? 'tablet' : ''} rar-${rar}">
                <div class="side-btn power"></div>
                <div class="side-btn vol-up"></div>
                <div class="side-btn vol-down"></div>
                <div class="screen-glass">
                    <div class="wallpaper"></div>
                    <div class="brand-logo">${logo}</div>
                </div>
                <div class="dynamic-island"></div>
                <div class="cam-module">${lenses}</div>
            </div>
        </div>
    `;
}

function render() {
    updateHeader();
    const screen = document.getElementById('screen');
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === state.currentTab));

    if (state.activeChat) return renderChat(screen);

    if (state.currentTab === 'market') renderMarket(screen);
    if (state.currentTab === 'workshop') renderWorkshop(screen);
    if (state.currentTab === 'shop') renderShop(screen);
    if (state.currentTab === 'cases') renderCases(screen);
    if (state.currentTab === 'quests') renderQuests(screen);
}

// --- Рынок ---
function renderMarket(screen) {
    fillMarket();
    let html = `<h3 style="margin-bottom:12px; font-size:15px;">🏪 Рынок</h3>`;
    html += `<div class="market-grid">`;
    state.marketListings.forEach(item => {
        html += `
            <div class="market-card rar-${item.rar}" onclick="openChat('market', ${item.id})">
                ${renderDevice(item.brand, item.rar, item.type==='tablet')}
                <div class="mc-title">${item.model}</div>
                <div class="mc-rarity">${RARITY[item.rar].name}</div>
                <div class="mc-price">${fmt(item.sellerPrice)} ₽</div>
            </div>
        `;
    });
    html += `</div>`;
    html += `<button class="btn btn-cyan" style="width:100%; margin-top:12px;" onclick="manualRefreshMarket()">🔄 Обновить рынок</button>`;
    html += `<button class="btn" style="width:100%; margin-top:8px; border-color:var(--gold); color:var(--gold);" onclick="openChat('friend', 0)">💬 Написать Вадиму</button>`;
    screen.innerHTML = html;
}

window.manualRefreshMarket = function() {
    state.marketListings = []; 
    fillMarket(); 
    saveGame();
    render();
    showToast('Рынок обновлен!');
};

// --- Мастерская ---
function renderWorkshop(screen) {
    if (state.workshopPhones.length === 0) {
        return screen.innerHTML = `<div style="text-align:center; padding:60px 20px; color:var(--muted);"><div style="font-size:40px;">🔧</div>Мастерская пуста.</div>`;
    }

    if (state.selectedPhoneId) {
        const p = state.workshopPhones.find(x => x.id === state.selectedPhoneId);
        if (!p) { state.selectedPhoneId = null; return render(); }

        const isTablet = p.type === 'tablet';
        let currentRisk = p.risk + 0.02; 
        if (p.repairStage === 2) currentRisk += 0.02; 

        let html = `<div class="workbench">`;
        html += `<div style="display:flex; justify-content:space-between; width:100%; align-items:center; margin-bottom:5px;">
            <button class="btn" onclick="state.selectedPhoneId=null; render();">← Назад</button>
            <div style="text-align:right;">
                <h3 style="font-size:15px; color:var(--${p.rar === 'legend' ? 'gold' : 'cyan'});">${p.model}</h3>
                <div style="font-size:10px; color:${RARITY[p.rar].color}; font-weight:900;">${RARITY[p.rar].name}</div>
            </div>
        </div>`;
        
        html += `<div id="phone-visual" style="position:relative;">${renderDevice(p.brand, p.rar, isTablet)}<div class="scan-line"></div></div>`;

        html += `<div class="repair-panel" id="repair-panel">
            <div style="font-size:12px; font-weight:900; color:var(--cyan);">
                ${p.repairStage === 0 ? '1. Разборка' : p.repairStage === 1 ? '2. Замена' : p.repairStage === 2 ? '3. Сборка' : p.repairStage === 3 ? '✅ Готов!' : '💥 СЛОМАН'}
            </div>`;

        if (p.repairStage >= 0 && p.repairStage < 3) {
            html += `<div class="risk-bar"><div class="risk-fill" style="width:${currentRisk*100}%"></div></div>`;
            html += `<div style="font-size:10px; color:var(--gold); font-weight:bold; margin-bottom:10px;">Риск: ${Math.round(currentRisk*100)}%</div>`;
        }

        if (p.repairStage === 0) {
            html += state.inventory.screwdriver > 0 ? `<button class="btn btn-cyan" style="width:100%;" onclick="doRepair(0)">🪛 Открутить винты</button>` : `<button class="btn btn-red" style="width:100%;" onclick="state.currentTab='shop'; render();">❌ Нужна отвёртка</button>`;
        } else if (p.repairStage === 1) {
            let neededPart = p.neededPart;
            let partName = PARTS_SHOP.find(x => x.id === neededPart)?.name || 'Деталь';
            let hasPart = state.inventory[neededPart] > 0;
            html += hasPart ? `<button class="btn btn-cyan" style="width:100%;" onclick="usePart()">⚙️ Заменить: ${partName}</button>` : `<button class="btn btn-red" style="width:100%;" onclick="state.currentTab='shop'; render();">❌ Нужно: ${partName}</button>`;
        } else if (p.repairStage === 2) {
            html += `<button class="btn btn-cyan" style="width:100%;" onclick="doRepair(0.02)">🔨 Собрать</button>`;
        } else if (p.repairStage === 3) {
            const sellPrice = Math.floor(p.basePrice * 1.7) + (isTablet ? 20000 : 0);
            html += `<button class="btn btn-green" style="width:100%; font-size:14px;" onclick="sellRepaired(${sellPrice})">💰 Продать за ${fmt(sellPrice)} ₽</button>`;
        }

        if (p.repairStage === -1) {
            html = `<div class="workbench"><h2 style="color:var(--red);">💔 Сломан</h2>
            ${renderDevice(p.brand, p.rar, isTablet)}
            <button class="btn btn-red" style="width:100%; margin-top:15px;" onclick="scrapPhone()">🗑️ Сдать (5000 ₽)</button></div>`;
        }
        html += `</div></div>`;
        screen.innerHTML = html;
        return;
    }

    let html = `<h3 style="margin-bottom:12px; font-size:15px;">🔧 Мастерская (${state.workshopPhones.length}/5)</h3>`;
    state.workshopPhones.forEach(p => {
        let status = p.repairStage === -1 ? '💥 Сломан' : p.repairStage === 3 ? '✅ Готов' : `⚙️ Этап ${p.repairStage + 1}/3`;
        html += `
            <div class="ws-list-item rar-${p.rar}" onclick="selectPhone(${p.id})">
                <div style="display:flex; gap:10px; align-items:center;">
                    ${renderDevice(p.brand, p.rar, p.type === 'tablet')}
                    <div>
                        <div style="font-weight:800; font-size:13px;">${p.model}</div>
                        <div style="font-size:9px; color:${RARITY[p.rar].color}; font-weight:900; margin-bottom:2px;">${RARITY[p.rar].name}</div>
                        <div style="font-size:10px; color:var(--cyan);">${status}</div>
                    </div>
                </div>
                <div style="font-size:16px; color:var(--muted);">➔</div>
            </div>
        `;
    });
    screen.innerHTML = html;
}

// --- Магазин ---
function renderShop(screen) {
    let html = `<h3 style="margin-bottom:12px; font-size:15px;">🛒 Запчасти</h3><div class="shop-grid">`;
    PARTS_SHOP.forEach(part => {
        const owned = state.inventory[part.id] || 0;
        html += `
            <div class="part-card">
                <div class="part-icon">${part.icon}</div>
                <div class="part-name">${part.name} ${owned > 0 ? `<span style="color:var(--green)">(${owned})</span>` : ''}</div>
                <div class="part-price">${fmt(part.price)} ₽</div>
                <button class="btn btn-cyan" style="width:100%; padding:6px; font-size:10px;" onclick="buyPart('${part.id}', ${part.price})">Купить</button>
            </div>
        `;
    });
    html += `</div>`;
    screen.innerHTML = html;
}

// --- Кейсы ---
function renderCases(screen) {
    let html = `<h3 style="margin-bottom:12px; font-size:15px;">📦 Кейсы</h3><div class="market-grid">`;
    html += `<div class="market-card rar-common"><div style="font-size:30px; margin:10px 0;">📦</div><div class="mc-title">Кейс Бомжа</div><button class="btn btn-cyan" style="width:100%; margin-top:8px;" onclick="openCase('bum')" ${state.cases.bum <= 0 ? 'disabled' : ''}>Открыть (${state.cases.bum})</button></div>`;
    html += `<div class="market-card rar-rare"><div style="font-size:30px; margin:10px 0;">🎁</div><div class="mc-title">Хороший Кейс</div><button class="btn btn-cyan" style="width:100%; margin-top:8px;" onclick="openCase('good')" ${state.cases.good <= 0 ? 'disabled' : ''}>Открыть (${state.cases.good})</button></div>`;
    html += `<div class="market-card rar-legend"><div style="font-size:30px; margin:10px 0;">👑</div><div class="mc-title">Премиум Кейс</div><button class="btn btn-cyan" style="width:100%; margin-top:8px;" onclick="openCase('premium')" ${state.cases.premium <= 0 ? 'disabled' : ''}>Открыть (${state.cases.premium})</button></div>`;
    html += `</div>`;
    screen.innerHTML = html;
}

// --- Квесты ---
function renderQuests(screen) {
    let html = `<h3 style="margin-bottom:12px; font-size:15px;">📋 Квесты</h3>`;
    state.quests.forEach(q => {
        let done = q.current >= q.target;
        let rewardText = q.rewardCase ? `📦 Кейс` : `5000 ₽`;
        html += `
            <div class="quest-card" style="${done ? 'opacity:0.5; border-color:var(--green);' : ''}">
                <div style="font-size:13px; font-weight:800; margin-bottom:4px;">${q.desc}</div>
                <div style="font-size:11px; color:var(--muted); margin-bottom:6px;">Прогресс: ${fmt(Math.min(q.current, q.target))} / ${fmt(q.target)}</div>
                <div style="font-size:12px; color:var(--gold); font-weight:900;">Награда: ${rewardText}</div>
            </div>
        `;
    });
    screen.innerHTML = html;
}

// --- ЧАТ ---
function openChat(type, id) {
    state.activeChat = type;
    state.offersCount = 0;
    if (type === 'market') {
        state.chatTarget = state.marketListings.find(x => x.id === id);
        state.chatHistory = [{ sender: 'seller', text: `Продаю ${state.chatTarget.model}. Цена: ${fmt(state.chatTarget.sellerPrice)}. Торг?` }];
    } else {
        state.chatHistory = [...state.friendChat];
    }
    render();
}

function renderChat(screen) {
    const isMarket = state.activeChat === 'market';
    let chatHtml = state.chatHistory.map(m => `<div class="msg ${m.sender}">${m.text}</div>`).join('');
    
    screen.innerHTML = `
        <div style="display:flex; justify-content:space-between; margin-bottom:10px; align-items:center;">
            <b style="font-size:15px;">${isMarket ? state.chatTarget.model : '👤 Вадим'}</b>
            <button class="btn" onclick="closeChat()">← Назад</button>
        </div>
        ${isMarket ? `<div style="display:flex; gap:10px; align-items:center; margin-bottom:10px;">${renderDevice(state.chatTarget.brand, state.chatTarget.rar)}<div><div class="mc-rarity rar-${state.chatTarget.rar}" style="display:inline-block;">${RARITY[state.chatTarget.rar].name}</div><div class="mc-price">${fmt(state.chatTarget.sellerPrice)} ₽</div></div></div>` : ''}
        <div class="chat-box" id="chatBox">${chatHtml}</div>
        <div style="display:flex; gap:6px;">
            ${isMarket ? `
                <button class="btn btn-gold" style="flex:1;" onclick="bargain()" ${state.offersCount >= 3 ? 'disabled' : ''}>Торг (${state.offersCount}/3)</button>
                <button class="btn btn-green" style="flex:1;" onclick="buyFromMarket()">Купить</button>
            ` : `
                ${!state.friendBorrowed ? `<button class="btn btn-cyan" style="flex:1;" onclick="borrow()">Занять 20 000 ₽</button>` : `<button class="btn btn-green" style="flex:1;" onclick="repay()" ${state.money < 20000 ? 'disabled' : ''}>Вернуть долг</button>`}
            `}
        </div>
    `;
    setTimeout(() => { const box = document.getElementById('chatBox'); if (box) box.scrollTop = box.scrollHeight; }, 50);
}

window.closeChat = function() { state.activeChat = null; render(); };

// ================= ДЕЙСТВИЯ =================

window.openCase = function(type) {
    if (state.cases[type] <= 0) return;
    if (state.workshopPhones.length >= 5) return showToast('Мастерская заполнена!');
    
    state.cases[type]--;
    let roll = Math.random();
    let pool = [];
    if (type === 'bum') pool = roll < 0.8 ? PHONE_DB.filter(p => p.rar === 'common') : PHONE_DB.filter(p => p.rar === 'rare');
    else if (type === 'good') pool = roll < 0.6 ? PHONE_DB.filter(p => p.rar === 'rare') : PHONE_DB.filter(p => p.rar === 'epic');
    else pool = roll < 0.4 ? PHONE_DB.filter(p => p.rar === 'epic') : PHONE_DB.filter(p => p.rar === 'legend');
    
    const wonPhone = { ...pool[Math.floor(Math.random() * pool.length)] };
    let possibleParts = ['screen_oled', 'screen_lcd', 'battery', 'camera_main', 'charging_port', 'speaker', 'flex_cable'];
    if (wonPhone.rar === 'legend' || wonPhone.rar === 'epic') possibleParts.push('motherboard', 'camera_front', 'back_glass', 'face_id');
    
    const phoneInstance = { ...wonPhone, id: state.nextId++, repairStage: 0, neededPart: possibleParts[Math.floor(Math.random() * possibleParts.length)] };
    state.workshopPhones.push(phoneInstance);
    saveGame();

    const screen = document.getElementById('screen');
    const overlay = document.createElement('div');
    overlay.style.cssText = 'position:absolute; inset:0; background:rgba(0,0,0,0.95); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; border-radius:20px;';
    overlay.innerHTML = `<div style="text-align:center;">
        <h2 style="color:var(--${wonPhone.rar==='legend'?'gold':'cyan'}); margin-bottom:10px;">ВЫПАЛО!</h2>
        ${renderDevice(wonPhone.brand, wonPhone.rar, wonPhone.type==='tablet')}
        <h3 style="margin-top:10px;">${wonPhone.model}</h3>
        <div style="font-size:12px; color:${RARITY[wonPhone.rar].color}; font-weight:900; text-transform:uppercase; margin-top:5px;">${RARITY[wonPhone.rar].name}</div>
    </div>`;
    screen.appendChild(overlay);
    setTimeout(() => { overlay.remove(); render(); }, 2500);
};

window.bargain = function() {
    const t = state.chatTarget;
    state.offersCount++;
    const newPrice = Math.floor(t.sellerPrice * (0.85 + Math.random() * 0.1));
    state.chatHistory.push({ sender: 'me', text: `Может, за ${fmt(newPrice)}?` });
    
    const roll = Math.random();
    if (roll < 0.5) { 
        t.sellerPrice = newPrice;
        state.chatHistory.push({ sender: 'seller', text: `Ладно, забирай.` });
    } else if (roll < 0.85) { 
        state.chatHistory.push({ sender: 'seller', text: `Нет, слишком мало.` });
    } else {
        state.chatHistory.push({ sender: 'seller', text: `Всё, блокирую.` });
        state.marketListings = state.marketListings.filter(x => x.id !== t.id);
        setTimeout(() => { state.activeChat = null; render(); }, 1500);
    }
    saveGame(); render();
};

window.buyFromMarket = function() {
    const t = state.chatTarget;
    if (state.money < t.sellerPrice) return showToast('Мало денег!');
    if (state.workshopPhones.length >= 5) return showToast('Мастерская заполнена!');
    
    state.money -= t.sellerPrice;
    let possibleParts = ['screen_oled', 'screen_lcd', 'battery', 'camera_main', 'charging_port', 'speaker', 'flex_cable'];
    if (t.rar === 'legend' || t.rar === 'epic') possibleParts.push('motherboard', 'camera_front', 'back_glass', 'face_id');
    
    const phoneInstance = { ...t, id: state.nextId++, repairStage: 0, neededPart: possibleParts[Math.floor(Math.random() * possibleParts.length)] };
    state.workshopPhones.push(phoneInstance);
    state.marketListings = state.marketListings.filter(x => x.id !== t.id);
    state.activeChat = null;
    
    updateQuest('buy', 1);
    state.currentTab = 'workshop';
    state.selectedPhoneId = null;
    saveGame(); render();
};

window.selectPhone = function(id) { state.selectedPhoneId = id; render(); };
window.buyPart = function(id, price) {
    if (state.money < price) return showToast('Мало денег!');
    state.money -= price; state.inventory[id]++; saveGame(); render();
};

function playRepairAnimation(callback) {
    const visual = document.getElementById('phone-visual');
    const panel = document.getElementById('repair-panel');
    if (!visual || !panel) return callback();
    
    const phone = visual.querySelector('.real-phone');
    if(phone) phone.classList.add('repairing');
    visual.classList.add('scanning');
    
    const sparksContainer = document.createElement('div');
    sparksContainer.className = 'sparks';
    sparksContainer.style.opacity = '1';
    
    for(let i=0; i<8; i++) {
        setTimeout(() => {
            const spark = document.createElement('div');
            spark.className = 'spark';
            spark.textContent = ['⚡','🔧','🔩','⚙️','✨'][Math.floor(Math.random()*5)];
            spark.style.setProperty('--x', (Math.random() * 120 - 60) + 'px');
            spark.style.setProperty('--y', (Math.random() * 120 - 60) + 'px');
            spark.style.left = '50%'; spark.style.top = '50%';
            sparksContainer.appendChild(spark);
            setTimeout(() => spark.remove(), 500);
        }, i * 50);
    }
    visual.appendChild(sparksContainer);

    const btns = panel.querySelectorAll('button');
    btns.forEach(b => b.disabled = true);

    setTimeout(() => {
        if(phone) phone.classList.remove('repairing');
        visual.classList.remove('scanning');
        sparksContainer.remove();
        callback();
    }, 900);
}

window.doRepair = function(extraRisk) {
    playRepairAnimation(() => {
        const p = state.workshopPhones.find(x => x.id === state.selectedPhoneId);
        let risk = p.risk + extraRisk; 
        
        if (Math.random() < risk) {
            p.repairStage = -1;
            showToast('💥 Хруст... Сломал!');
        } else {
            p.repairStage++;
            if (p.repairStage === 3) showToast('✅ Собран!');
            else showToast('⚙️ Успешно.');
        }
        saveGame(); render();
    });
};

window.usePart = function() {
    playRepairAnimation(() => {
        const p = state.workshopPhones.find(x => x.id === state.selectedPhoneId);
        if (state.inventory[p.neededPart] > 0) {
            state.inventory[p.neededPart]--;
            p.repairStage = 2; 
            showToast('Деталь заменена!');
            saveGame(); render();
        }
    });
};

window.sellRepaired = function(price) {
    addMoney(price);
    addXP(200);
    updateQuest('sell', 1);
    updateQuest('earn_daily', price);
    showToast(`💰 Продано за ${fmt(price)}!`);
    state.workshopPhones = state.workshopPhones.filter(x => x.id !== state.selectedPhoneId);
    state.selectedPhoneId = null;
    state.currentTab = 'workshop';
    saveGame(); render();
};

window.scrapPhone = function() {
    addMoney(5000);
    showToast('💸 Сдано за 5000 ₽');
    state.workshopPhones = state.workshopPhones.filter(x => x.id !== state.selectedPhoneId);
    state.selectedPhoneId = null;
    state.currentTab = 'workshop';
    saveGame(); render();
};

window.borrow = function() {
    addMoney(20000); state.friendBorrowed = true;
    state.chatHistory.push({ sender: 'me', text: 'Выручай!' });
    state.chatHistory.push({ sender: 'friend', text: 'Кидаю 20к.' });
    state.friendChat = [...state.chatHistory];
    saveGame(); render();
};
window.repay = function() {
    state.money -= 20000; state.friendBorrowed = false;
    state.chatHistory.push({ sender: 'me', text: 'Держи долг!' });
    state.chatHistory.push({ sender: 'friend', text: 'О, красава!' });
    state.friendChat = [...state.chatHistory];
    saveGame(); render();
};

document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
        state.activeChat = null;
        state.selectedPhoneId = null;
        state.currentTab = t.dataset.tab;
        render();
    });
});

loadGame();
render();
</script>
</body>
</html>
